<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>错题随机复习生成器</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", sans-serif;
      background: #f5f7fb;
      color: #1f2937;
    }
    header {
      background: linear-gradient(135deg, #2563eb, #7c3aed);
      color: white;
      text-align: center;
      padding: 34px 16px;
    }
    header h1 { margin: 0 0 8px; font-size: 30px; }
    header p { margin: 0; opacity: 0.92; }
    main { max-width: 1100px; margin: 0 auto; padding: 20px 14px 46px; }
    .stats {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 14px;
      margin-bottom: 18px;
    }
    .stat, .panel {
      background: white;
      border: 1px solid #e5e7eb;
      border-radius: 16px;
      box-shadow: 0 8px 24px rgba(15, 23, 42, 0.08);
    }
    .stat { padding: 15px; }
    .stat .label { color: #6b7280; font-size: 14px; margin-bottom: 8px; }
    .stat .value { font-size: 28px; font-weight: 800; }
    .layout { display: grid; grid-template-columns: 360px 1fr; gap: 18px; align-items: start; }
    .panel { padding: 18px; margin-bottom: 18px; }
    h2 { margin: 0 0 14px; font-size: 20px; }
    label { display: block; color: #4b5563; font-size: 14px; margin: 12px 0 6px; }
    input, select, textarea {
      width: 100%;
      border: 1px solid #d1d5db;
      border-radius: 10px;
      padding: 10px 11px;
      font-size: 15px;
      outline: none;
      background: white;
    }
    input:focus, select:focus, textarea:focus {
      border-color: #2563eb;
      box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.14);
    }
    textarea { min-height: 84px; resize: vertical; }
    .row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .buttons { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 14px; }
    button, .file-label {
      border: 0;
      border-radius: 10px;
      padding: 10px 14px;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      color: white;
      background: #2563eb;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }
    button:hover, .file-label:hover { opacity: 0.9; }
    button.success { background: #16a34a; }
    button.danger { background: #dc2626; }
    button.gray, .file-label { background: #374151; }
    button.soft { background: #eef2ff; color: #3730a3; }
    input[type="file"] { display: none; }
    .sync-box { border-top: 1px solid #e5e7eb; margin-top: 16px; padding-top: 14px; }
    .sync-box h3 { margin: 0 0 10px; font-size: 17px; }
    .notice { min-height: 20px; margin-top: 10px; color: #047857; font-size: 14px; line-height: 1.6; }
    .error { color: #dc2626; }
    .alert {
      border: 1px solid #fecaca;
      background: #fef2f2;
      color: #991b1b;
      border-radius: 12px;
      padding: 10px 12px;
      font-size: 14px;
      line-height: 1.7;
      margin-bottom: 12px;
    }
    .toolbar { display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; align-items: end; margin-bottom: 14px; }
    .toolbar .count-box { width: 180px; }
    .card-list { display: grid; gap: 12px; }
    .card {
      border: 1px solid #e5e7eb;
      border-radius: 14px;
      background: white;
      padding: 14px;
    }
    .card.due { border-color: #f59e0b; background: #fffbeb; }
    .card-title { display: flex; justify-content: space-between; gap: 10px; align-items: flex-start; margin-bottom: 8px; }
    .card-title strong { font-size: 17px; }
    .tag {
      display: inline-flex;
      border-radius: 999px;
      padding: 4px 8px;
      background: #e0e7ff;
      color: #3730a3;
      font-size: 12px;
      font-weight: 700;
      white-space: nowrap;
    }
    .tag.red { background: #fee2e2; color: #991b1b; }
    .tag.orange { background: #ffedd5; color: #9a3412; }
    .tag.green { background: #dcfce7; color: #166534; }
    .meta { color: #4b5563; font-size: 14px; line-height: 1.8; }
    .empty {
      text-align: center;
      color: #6b7280;
      border: 1px dashed #d1d5db;
      border-radius: 14px;
      padding: 28px 12px;
      background: #fafafa;
    }
    .filters { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 12px; }
    .progress {
      border: 1px solid #e5e7eb;
      background: #f8fafc;
      color: #475569;
      border-radius: 12px;
      padding: 10px 12px;
      font-size: 14px;
      margin-bottom: 12px;
    }
    @media (max-width: 900px) {
      .stats { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .layout { grid-template-columns: 1fr; }
    }
    @media (max-width: 560px) {
      .stats, .row, .filters { grid-template-columns: 1fr; }
      button, .file-label { width: 100%; }
      .toolbar .count-box { width: 100%; }
    }
    @media print {
      header, .stats, .layout > div:first-child, .wrong-library, .buttons, .toolbar label, .toolbar select { display: none !important; }
      body { background: white; }
      main { max-width: none; padding: 0; }
      .layout { display: block; }
      .panel { box-shadow: none; border: 0; }
      .card { break-inside: avoid; margin-bottom: 16px; min-height: 150px; }
      .card::after { content: "解题区：\A\A\A"; white-space: pre; display: block; margin-top: 16px; border-top: 1px dashed #9ca3af; color: #6b7280; padding-top: 10px; }
    }
  </style>
</head>
<body>
  <header>
    <h1>错题随机复习生成器</h1>
    <p>录入错题题号，系统按遗忘曲线和久未出现程度生成每日复习清单。</p>
  </header>

  <main>
    <section class="stats">
      <div class="stat"><div class="label">错题总数</div><div class="value" id="totalCount">0</div></div>
      <div class="stat"><div class="label">今日生成</div><div class="value" id="todayCount">0</div></div>
      <div class="stat"><div class="label">今日已完成</div><div class="value" id="doneCount">0</div></div>
      <div class="stat"><div class="label">今日应复习</div><div class="value" id="dueCount">0</div></div>
    </section>

    <section class="layout">
      <div>
        <section class="panel">
          <h2>输入错题</h2>
          <form id="questionForm">
            <label for="subject">科目</label>
            <input id="subject" placeholder="如 数学二、408 操作系统、英语" required />

            <label for="source">哪本书 / 哪张卷子</label>
            <input id="source" placeholder="如 2021 真题、张宇 1000 题、王道操作系统" required />

            <div class="row">
              <div>
                <label for="number">题号</label>
                <input id="number" placeholder="如 17、第32题" required />
              </div>
              <div>
                <label for="knowledge">知识点</label>
                <input id="knowledge" placeholder="如 极限、进程调度" required />
              </div>
            </div>

            <label for="wrongReason">错的原因</label>
            <input id="wrongReason" placeholder="如 概念不清、计算错误、审题错误、方法不会" />

            <div class="buttons">
              <button type="submit">添加错题</button>
              <button type="button" class="soft" id="clearBtn">清空</button>
            </div>
            <div class="notice" id="formNotice"></div>
          </form>
        </section>

        <section class="panel">
          <h2>数据备份</h2>
          <div class="alert"><strong>重要：</strong>数据只保存在当前浏览器。清缓存、换浏览器或换电脑可能丢失，请定期导出 JSON。</div>
          <div class="buttons">
            <button class="gray" id="exportBtn">导出 JSON</button>
            <label class="file-label" for="importFile">导入 JSON</label>
            <input id="importFile" type="file" accept="application/json,.json" />
            <button class="danger" id="clearAllBtn">清空全部</button>
          </div>
          <div class="notice" id="dataNotice"></div>

          <div class="sync-box">
            <h3>GitHub 云备份</h3>
            <div class="alert"><strong>Token 安全提示：</strong>Token 只在你当前浏览器中使用，不会写进网页源码。公共电脑不要选择保存 Token。</div>

            <label for="githubToken">GitHub Token</label>
            <input id="githubToken" type="password" autocomplete="off" placeholder="粘贴 GitHub Token" />

            <label for="githubTokenMode">Token 保存方式</label>
            <select id="githubTokenMode">
              <option value="session">仅本次打开页面使用</option>
              <option value="local">保存到当前浏览器</option>
            </select>

            <div class="row">
              <div>
                <label for="githubOwner">Owner</label>
                <input id="githubOwner" value="fhqdragon" />
              </div>
              <div>
                <label for="githubRepo">Repo</label>
                <input id="githubRepo" value="wrong-review" />
              </div>
            </div>

            <div class="row">
              <div>
                <label for="githubPath">保存路径</label>
                <input id="githubPath" value="data/questions.json" />
              </div>
              <div>
                <label for="githubBranch">分支</label>
                <input id="githubBranch" value="main" />
              </div>
            </div>

            <div class="buttons">
              <button class="success" id="githubUploadBtn">上传到 GitHub</button>
              <button class="soft" id="githubDownloadBtn">从 GitHub 下载</button>
              <button class="gray" id="sharedDownloadBtn">从共享题库加载</button>
            </div>
            <div class="notice" id="githubNotice"></div>
          </div>
        </section>
      </div>

      <div>
        <section class="panel">
          <div class="toolbar">
            <h2>每日生成</h2>
            <div class="count-box">
              <label for="generateCount">生成数量</label>
              <input id="generateCount" type="number" min="1" max="100" value="10" placeholder="输入要生成几道" />
            </div>
            <div class="buttons">
              <button id="generateBtn">生成错题</button>
              <button class="soft" id="printBtn">打印</button>
            </div>
          </div>
          <div class="progress" id="progressBox">今日进度：0 / 0</div>
          <div id="todayList" class="card-list"></div>
        </section>

        <section class="panel wrong-library">
          <h2>错题库</h2>
          <div class="filters">
            <input id="searchInput" placeholder="搜索科目 / 书卷 / 题号 / 知识点" />
            <select id="sortBy">
              <option value="priority">优先复习排序</option>
              <option value="oldest">最久未生成</option>
              <option value="wrong">不会次数最多</option>
              <option value="newest">最新录入</option>
            </select>
          </div>
          <div id="libraryList" class="card-list"></div>
        </section>
      </div>
    </section>
  </main>

  <script>
    const STORAGE_KEY = "wrong-question-simple-v1";
    const OLD_STORAGE_KEY = "wrong-question-review-v1";
    const TODAY_KEY = "wrong-question-simple-today-v1";
    const GITHUB_SYNC_KEY = "wrong-question-simple-github-sync-v1";
    const GITHUB_TOKEN_KEY = "wrong-question-simple-github-token-v1";
    const intervals = [1, 2, 4, 7, 15, 30, 60];

    let questions = loadQuestions();
    let todaySet = loadTodaySet();
    let githubSessionToken = "";

    const form = document.getElementById("questionForm");
    const subjectEl = document.getElementById("subject");
    const sourceEl = document.getElementById("source");
    const numberEl = document.getElementById("number");
    const knowledgeEl = document.getElementById("knowledge");
    const wrongReasonEl = document.getElementById("wrongReason");
    const formNotice = document.getElementById("formNotice");
    const dataNotice = document.getElementById("dataNotice");
    const githubTokenEl = document.getElementById("githubToken");
    const githubTokenModeEl = document.getElementById("githubTokenMode");
    const githubOwnerEl = document.getElementById("githubOwner");
    const githubRepoEl = document.getElementById("githubRepo");
    const githubPathEl = document.getElementById("githubPath");
    const githubBranchEl = document.getElementById("githubBranch");
    const githubNotice = document.getElementById("githubNotice");
    const generateCountEl = document.getElementById("generateCount");
    const progressBox = document.getElementById("progressBox");
    const todayList = document.getElementById("todayList");
    const libraryList = document.getElementById("libraryList");
    const searchInput = document.getElementById("searchInput");
    const sortBy = document.getElementById("sortBy");

    applyGithubConfig();

    form.addEventListener("submit", event => {
      event.preventDefault();
      const subject = subjectEl.value.trim();
      const source = sourceEl.value.trim();
      const number = normalizeNumber(numberEl.value);
      const knowledge = knowledgeEl.value.trim();
      const wrongReason = wrongReasonEl.value.trim();

      const duplicate = questions.find(item => item.subject === subject && item.source === source && normalizeNumber(item.number) === number);
      if (duplicate && !confirm("这道错题已经存在，是否仍然添加？")) return;

      questions.unshift(normalizeQuestion({
        id: createId(),
        subject,
        source,
        number,
        knowledge,
        wrongReason,
        createdAt: new Date().toISOString(),
        lastGeneratedDate: null,
        nextReviewDate: addDays(today(), 1),
        reviewCount: 0,
        wrongCount: 0,
        consecutiveKnown: 0
      }));
      saveQuestions();
      renderAll();
      numberEl.value = "";
      knowledgeEl.value = "";
      wrongReasonEl.value = "";
      numberEl.focus();
      showNotice(formNotice, "已添加错题，明天开始进入复习池。", false);
    });

    document.getElementById("clearBtn").addEventListener("click", () => {
      form.reset();
      showNotice(formNotice, "已清空输入框。", false);
    });

    document.getElementById("generateBtn").addEventListener("click", () => {
      if (todaySet.ids.length && !confirm("今日清单还没有完成，是否重新生成？")) return;
      const count = Math.max(1, Math.min(100, Number(generateCountEl.value || 10)));
      generateCountEl.value = count;
      const selected = pickQuestions(count);
      const date = today();
      selected.forEach(item => {
        item.lastGeneratedDate = date;
        item.generatedCount += 1;
      });
      todaySet = { date, ids: selected.map(item => item.id), initialCount: selected.length };
      saveQuestions();
      saveTodaySet();
      renderAll();
      showNotice(dataNotice, selected.length ? `已生成 ${selected.length} 道错题。` : "暂无可生成的错题。", false);
    });

    document.getElementById("printBtn").addEventListener("click", () => window.print());
    searchInput.addEventListener("input", renderLibrary);
    sortBy.addEventListener("change", renderLibrary);

    document.getElementById("exportBtn").addEventListener("click", () => {
      const blob = new Blob([JSON.stringify({ version: 1, exportedAt: new Date().toISOString(), questions }, null, 2)], { type: "application/json" });
      const url = URL.createObjectURL(blob);
      const link = document.createElement("a");
      link.href = url;
      link.download = `错题随机复习备份-${today()}.json`;
      link.click();
      URL.revokeObjectURL(url);
      showNotice(dataNotice, "已导出 JSON 备份。", false);
    });

    document.getElementById("importFile").addEventListener("change", event => {
      const file = event.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = () => {
        try {
          const parsed = JSON.parse(reader.result);
          const imported = Array.isArray(parsed) ? parsed : parsed.questions;
          if (!Array.isArray(imported)) throw new Error("invalid");
          questions = imported.map(normalizeQuestion);
          todaySet = { date: today(), ids: [], initialCount: 0 };
          saveQuestions();
          saveTodaySet();
          renderAll();
          showNotice(dataNotice, `导入成功，共 ${questions.length} 道错题。`, false);
        } catch (error) {
          showNotice(dataNotice, "导入失败，请选择正确的 JSON 文件。", true);
        } finally {
          event.target.value = "";
        }
      };
      reader.readAsText(file, "utf-8");
    });

    document.getElementById("clearAllBtn").addEventListener("click", () => {
      if (!confirm("确定清空全部错题吗？建议先导出备份。")) return;
      questions = [];
      todaySet = { date: today(), ids: [], initialCount: 0 };
      saveQuestions();
      saveTodaySet();
      renderAll();
      showNotice(dataNotice, "全部数据已清空。", false);
    });

    [githubOwnerEl, githubRepoEl, githubPathEl, githubBranchEl, githubTokenModeEl].forEach(element => {
      element.addEventListener("change", saveGithubConfig);
    });
    githubTokenEl.addEventListener("input", saveGithubToken);
    document.getElementById("githubUploadBtn").addEventListener("click", uploadToGithub);
    document.getElementById("githubDownloadBtn").addEventListener("click", downloadFromGithub);
    document.getElementById("sharedDownloadBtn").addEventListener("click", downloadSharedLibrary);

    function applyGithubConfig() {
      const saved = loadGithubConfig();
      githubOwnerEl.value = saved.owner;
      githubRepoEl.value = saved.repo;
      githubPathEl.value = saved.path;
      githubBranchEl.value = saved.branch;
      githubTokenModeEl.value = saved.tokenMode;
      if (saved.tokenMode === "local") githubTokenEl.value = localStorage.getItem(GITHUB_TOKEN_KEY) || "";
    }

    function loadGithubConfig() {
      const defaults = { owner: "fhqdragon", repo: "wrong-review", path: "data/questions.json", branch: "main", tokenMode: "session" };
      try {
        return { ...defaults, ...JSON.parse(localStorage.getItem(GITHUB_SYNC_KEY) || "{}") };
      } catch (error) {
        return defaults;
      }
    }

    function saveGithubConfig() {
      const config = getGithubConfig(false);
      localStorage.setItem(GITHUB_SYNC_KEY, JSON.stringify({
        owner: config.owner,
        repo: config.repo,
        path: config.path,
        branch: config.branch,
        tokenMode: config.tokenMode
      }));
      saveGithubToken();
    }

    function saveGithubToken() {
      if (githubTokenModeEl.value === "local") {
        localStorage.setItem(GITHUB_TOKEN_KEY, githubTokenEl.value.trim());
      } else {
        githubSessionToken = githubTokenEl.value.trim();
        localStorage.removeItem(GITHUB_TOKEN_KEY);
      }
    }

    function getGithubConfig(requireToken = true) {
      const config = {
        token: githubTokenModeEl.value === "local" ? (localStorage.getItem(GITHUB_TOKEN_KEY) || githubTokenEl.value.trim()) : (githubSessionToken || githubTokenEl.value.trim()),
        tokenMode: githubTokenModeEl.value,
        owner: githubOwnerEl.value.trim(),
        repo: githubRepoEl.value.trim(),
        path: githubPathEl.value.trim().replace(/^\/+/, ""),
        branch: githubBranchEl.value.trim()
      };
      if (!config.owner || !config.repo || !config.path || !config.branch) throw new Error("请填写完整的 GitHub 仓库配置。");
      if (requireToken && !config.token) throw new Error("请先填写 GitHub Token。");
      return config;
    }

    function loadQuestions() {
      const current = localStorage.getItem(STORAGE_KEY);
      if (current) {
        try { return JSON.parse(current).map(normalizeQuestion); } catch (error) { return []; }
      }
      const old = localStorage.getItem(OLD_STORAGE_KEY);
      if (!old) return [];
      try {
        const oldItems = JSON.parse(old);
        const migrated = oldItems.map(item => normalizeQuestion({
          subject: item.subject,
          source: item.source || item.type || "旧数据",
          number: item.number,
          knowledge: item.knowledge,
          wrongReason: item.wrongReason || item.mistakeReason || item.note || "",
          createdAt: item.createdAt,
          lastGeneratedDate: item.lastReviewDate,
          nextReviewDate: item.nextReviewDate,
          reviewCount: item.reviewCount,
          wrongCount: item.wrongCount,
          consecutiveKnown: item.streak || 0
        }));
        localStorage.setItem(STORAGE_KEY, JSON.stringify(migrated));
        return migrated;
      } catch (error) {
        return [];
      }
    }

    function saveQuestions() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(questions));
    }

    function loadTodaySet() {
      try {
        const saved = JSON.parse(localStorage.getItem(TODAY_KEY) || "null");
        if (saved && saved.date === today() && Array.isArray(saved.ids)) {
          return { date: saved.date, ids: saved.ids, initialCount: Number(saved.initialCount || saved.ids.length) };
        }
      } catch (error) {}
      return { date: today(), ids: [], initialCount: 0 };
    }

    function saveTodaySet() {
      localStorage.setItem(TODAY_KEY, JSON.stringify(todaySet));
    }

    async function getGithubFile(config) {
      const url = `https://api.github.com/repos/${encodeURIComponent(config.owner)}/${encodeURIComponent(config.repo)}/contents/${config.path}?ref=${encodeURIComponent(config.branch)}`;
      const response = await fetch(url, { headers: githubHeaders(config) });
      const body = await readGithubBody(response);
      if (response.status === 404) return { exists: false };
      if (!response.ok) throw new Error(getGithubErrorMessage(response, body));
      return { exists: true, sha: body.sha, content: body.content, htmlUrl: body.html_url };
    }

    async function uploadToGithub() {
      try {
        saveGithubConfig();
        const config = getGithubConfig(true);
        const remote = await getGithubFile(config);
        const message = remote.exists
          ? `将用当前浏览器里的 ${questions.length} 道错题覆盖 GitHub 备份，是否继续？`
          : `GitHub 上还没有备份文件，将创建 ${config.path}，是否继续？`;
        if (!confirm(message)) return;
        const payload = JSON.stringify({
          version: 1,
          app: "wrong-question-simple",
          exportedAt: new Date().toISOString(),
          count: questions.length,
          questions
        }, null, 2);
        const body = {
          message: "Update wrong question backup",
          content: encodeBase64Utf8(payload),
          branch: config.branch
        };
        if (remote.exists) body.sha = remote.sha;
        const response = await fetch(`https://api.github.com/repos/${encodeURIComponent(config.owner)}/${encodeURIComponent(config.repo)}/contents/${config.path}`, {
          method: "PUT",
          headers: { ...githubHeaders(config), "Content-Type": "application/json" },
          body: JSON.stringify(body)
        });
        const result = await readGithubBody(response);
        if (!response.ok) throw new Error(getGithubErrorMessage(response, result));
        showNotice(githubNotice, `已上传到 GitHub：${questions.length} 道错题。`, false);
      } catch (error) {
        showNotice(githubNotice, error.message || "上传失败。", true);
      }
    }

    async function downloadFromGithub() {
      try {
        saveGithubConfig();
        const config = getGithubConfig(true);
        const remote = await getGithubFile(config);
        if (!remote.exists) {
          showNotice(githubNotice, "GitHub 上还没有备份文件，请先上传本地数据。", true);
          return;
        }
        const text = decodeBase64Utf8(remote.content);
        const parsed = JSON.parse(text);
        const imported = Array.isArray(parsed) ? parsed : parsed.questions;
        if (!Array.isArray(imported)) throw new Error("GitHub 备份文件格式不正确。");
        if (!confirm(`将用 GitHub 上的 ${imported.length} 道错题覆盖当前浏览器里的 ${questions.length} 道错题，是否继续？`)) return;
        questions = imported.map(normalizeQuestion);
        todaySet = { date: today(), ids: [], initialCount: 0 };
        saveQuestions();
        saveTodaySet();
        renderAll();
        showNotice(githubNotice, `已从 GitHub 下载并恢复 ${questions.length} 道错题。`, false);
      } catch (error) {
        showNotice(githubNotice, error.message || "下载失败。", true);
      }
    }

    async function downloadSharedLibrary() {
      try {
        const config = getGithubConfig(false);
        const remote = await getGithubFile({ ...config, token: "" });
        if (!remote.exists) {
          showNotice(githubNotice, "共享题库还没有数据。你先用 Token 上传一次，朋友就能加载。", true);
          return;
        }
        const text = decodeBase64Utf8(remote.content);
        const parsed = JSON.parse(text);
        const imported = Array.isArray(parsed) ? parsed : parsed.questions;
        if (!Array.isArray(imported)) throw new Error("共享题库格式不正确。");
        if (!confirm(`将加载共享题库里的 ${imported.length} 道错题，并覆盖当前浏览器里的 ${questions.length} 道错题，是否继续？`)) return;
        questions = imported.map(normalizeQuestion);
        todaySet = { date: today(), ids: [], initialCount: 0 };
        saveQuestions();
        saveTodaySet();
        renderAll();
        showNotice(githubNotice, `已加载共享题库：${questions.length} 道错题。`, false);
      } catch (error) {
        showNotice(githubNotice, error.message || "共享题库加载失败。", true);
      }
    }

    function githubHeaders(config) {
      const headers = {
        "Accept": "application/vnd.github+json",
        "X-GitHub-Api-Version": "2022-11-28"
      };
      if (config.token) headers.Authorization = `Bearer ${config.token}`;
      return headers;
    }

    async function readGithubBody(response) {
      const text = await response.text();
      if (!text) return {};
      try { return JSON.parse(text); } catch (error) { return { message: text }; }
    }

    function getGithubErrorMessage(response, body) {
      if (response.status === 401) return "GitHub Token 无效或已过期。";
      if (response.status === 403) return "GitHub 拒绝访问，请检查 Token 是否有 Contents Read and write 权限。";
      if (response.status === 404) return "没有找到 GitHub 仓库、分支或文件，请检查配置和 Token 授权。";
      if (response.status === 409) return "GitHub 文件版本冲突，请先从 GitHub 下载确认后再上传。";
      if (response.status === 422) return "GitHub 保存失败，请检查路径、分支或文件内容。";
      return body.message || `GitHub 请求失败：${response.status}`;
    }

    function encodeBase64Utf8(text) {
      const bytes = new TextEncoder().encode(text);
      let binary = "";
      bytes.forEach(byte => binary += String.fromCharCode(byte));
      return btoa(binary);
    }

    function decodeBase64Utf8(base64) {
      const binary = atob(String(base64).replace(/\s/g, ""));
      const bytes = Uint8Array.from(binary, char => char.charCodeAt(0));
      return new TextDecoder("utf-8").decode(bytes);
    }

    function normalizeQuestion(item) {
      return {
        id: item.id || createId(),
        subject: item.subject || "未分类",
        source: item.source || "未填写",
        number: normalizeNumber(item.number || ""),
        knowledge: item.knowledge || "未填写",
        wrongReason: item.wrongReason || "未填写",
        lastWrongDate: item.lastWrongDate || null,
        createdAt: item.createdAt || new Date().toISOString(),
        lastGeneratedDate: item.lastGeneratedDate || null,
        nextReviewDate: item.nextReviewDate || addDays(today(), 1),
        reviewCount: Number(item.reviewCount || 0),
        wrongCount: Number(item.wrongCount || 0),
        generatedCount: Number(item.generatedCount || 0),
        consecutiveKnown: Number(item.consecutiveKnown || 0)
      };
    }

    function pickQuestions(count) {
      const current = today();
      return questions
        .map(item => ({ ...item, score: getScore(item, current) }))
        .sort((a, b) => b.score - a.score)
        .slice(0, count)
        .map(scored => questions.find(item => item.id === scored.id));
    }

    function getScore(item, current) {
      const overdueDays = Math.max(0, daysBetween(item.nextReviewDate, current));
      const lastGeneratedGap = item.lastGeneratedDate ? Math.max(0, daysBetween(item.lastGeneratedDate, current)) : 30;
      const dueScore = item.nextReviewDate <= current ? 1000 : 0;
      const wrongScore = item.wrongCount * 140;
      const recentWrongScore = item.lastWrongDate ? Math.max(0, 7 - daysBetween(item.lastWrongDate, current)) * 35 : 0;
      const reasonScore = item.wrongReason && item.wrongReason !== "未填写" ? 40 : 0;
      const neverScore = item.generatedCount === 0 ? 160 : 0;
      const knownPenalty = item.consecutiveKnown * 90;
      return dueScore + overdueDays * 45 + lastGeneratedGap * 18 + wrongScore + recentWrongScore + reasonScore + neverScore - knownPenalty + Math.random();
    }

    function markKnown(id) {
      const item = questions.find(question => question.id === id);
      if (!item) return;
      item.reviewCount += 1;
      item.consecutiveKnown += 1;
      if (item.consecutiveKnown >= 3) {
        questions = questions.filter(question => question.id !== id);
        todaySet.ids = todaySet.ids.filter(questionId => questionId !== id);
        saveQuestions();
        saveTodaySet();
        renderAll();
        alert(`“${item.subject}｜${item.source}｜第 ${item.number} 题”已经连续 3 次会了，已自动从错题库删除。`);
        return;
      }
      const interval = intervals[Math.min(item.reviewCount, intervals.length - 1)];
      item.nextReviewDate = addDays(today(), interval);
      todaySet.ids = todaySet.ids.filter(questionId => questionId !== id);
      saveQuestions();
      saveTodaySet();
      renderAll();
    }

    function markWrong(id) {
      const item = questions.find(question => question.id === id);
      if (!item) return;
      item.wrongCount += 1;
      item.consecutiveKnown = 0;
      item.lastWrongDate = today();
      item.nextReviewDate = addDays(today(), 1);
      todaySet.ids = todaySet.ids.filter(questionId => questionId !== id);
      saveQuestions();
      saveTodaySet();
      renderAll();
    }

    function removeQuestion(id) {
      if (!confirm("确定删除这道错题吗？")) return;
      questions = questions.filter(item => item.id !== id);
      todaySet.ids = todaySet.ids.filter(questionId => questionId !== id);
      saveQuestions();
      saveTodaySet();
      renderAll();
    }

    function renderAll() {
      renderStats();
      renderToday();
      renderLibrary();
    }

    function renderStats() {
      const current = today();
      const done = Math.max(0, Number(todaySet.initialCount || 0) - todaySet.ids.length);
      document.getElementById("totalCount").textContent = questions.length;
      document.getElementById("todayCount").textContent = todaySet.initialCount || todaySet.ids.length;
      document.getElementById("doneCount").textContent = done;
      document.getElementById("dueCount").textContent = questions.filter(item => item.nextReviewDate <= current).length;
    }

    function renderToday() {
      const items = todaySet.ids.map(id => questions.find(item => item.id === id)).filter(Boolean);
      const total = Math.max(Number(todaySet.initialCount || 0), items.length);
      const done = total - items.length;
      progressBox.textContent = `今日进度：${done} / ${total}`;
      if (!items.length) {
        todayList.innerHTML = `<div class="empty">还没有生成今日错题，选择数量后点击“生成错题”。</div>`;
        return;
      }
      todayList.innerHTML = items.map((item, index) => renderQuestionCard(item, index + 1, true)).join("");
    }

    function renderLibrary() {
      const keyword = searchInput.value.trim().toLowerCase();
      let list = questions.filter(item => {
        const text = `${item.subject} ${item.source} ${item.number} ${item.knowledge} ${item.wrongReason}`.toLowerCase();
        return !keyword || text.includes(keyword);
      });
      list = sortQuestions(list);
      if (!list.length) {
        libraryList.innerHTML = `<div class="empty">暂无错题。先在左侧输入错题。</div>`;
        return;
      }
      libraryList.innerHTML = list.map(item => renderQuestionCard(item, null, false)).join("");
    }

    function renderQuestionCard(item, index, isTodayCard) {
      const current = today();
      const overdue = Math.max(0, daysBetween(item.nextReviewDate, current));
      const lastGap = item.lastGeneratedDate ? daysBetween(item.lastGeneratedDate, current) : null;
      const dueClass = item.nextReviewDate <= current ? "due" : "";
      const dueText = item.nextReviewDate <= current ? overdue > 0 ? `已晚复习 ${overdue} 天` : "今日应复习" : `${daysBetween(current, item.nextReviewDate)} 天后复习`;
      return `
        <article class="card ${dueClass}">
          <div class="card-title">
            <strong>${index ? `第 ${index} 道：` : ""}${escapeHtml(item.subject)}｜${escapeHtml(item.source)}｜第 ${escapeHtml(item.number)} 题</strong>
            <span class="tag ${item.nextReviewDate <= current ? "orange" : "green"}">${escapeHtml(dueText)}</span>
          </div>
          <div class="meta">
            知识点：${escapeHtml(item.knowledge)}<br />
            错的原因：${escapeHtml(item.wrongReason || "未填写")}<br />
            错的次数：${item.wrongCount} ｜ 连续会了：${item.consecutiveKnown} / 3 ｜ 生成次数：${item.generatedCount}<br />
            上次生成：${escapeHtml(item.lastGeneratedDate || "从未生成")} ｜ ${lastGap === null ? "从未出现" : `距上次出现 ${lastGap} 天`} ｜ 下次复习：${escapeHtml(item.nextReviewDate)}
          </div>
          <div class="buttons">
            ${isTodayCard ? `<button class="success" onclick="markKnown('${item.id}')">会了</button><button class="danger" onclick="markWrong('${item.id}')">不会</button>` : `<button class="soft" onclick="removeQuestion('${item.id}')">删除</button>`}
          </div>
        </article>
      `;
    }

    function sortQuestions(list) {
      const current = today();
      const sorted = [...list];
      if (sortBy.value === "priority") sorted.sort((a, b) => getScore(b, current) - getScore(a, current));
      if (sortBy.value === "oldest") sorted.sort((a, b) => daysBetween(b.lastGeneratedDate || "2000-01-01", current) - daysBetween(a.lastGeneratedDate || "2000-01-01", current));
      if (sortBy.value === "wrong") sorted.sort((a, b) => b.wrongCount - a.wrongCount);
      if (sortBy.value === "newest") sorted.sort((a, b) => String(b.createdAt).localeCompare(String(a.createdAt)));
      return sorted;
    }

    function today() {
      return formatDate(new Date());
    }

    function addDays(dateText, days) {
      const date = new Date(`${dateText}T00:00:00`);
      date.setDate(date.getDate() + days);
      return formatDate(date);
    }

    function daysBetween(from, to) {
      const start = new Date(`${from}T00:00:00`);
      const end = new Date(`${to}T00:00:00`);
      return Math.floor((end - start) / 86400000);
    }

    function formatDate(date) {
      const d = new Date(date);
      const year = d.getFullYear();
      const month = String(d.getMonth() + 1).padStart(2, "0");
      const day = String(d.getDate()).padStart(2, "0");
      return `${year}-${month}-${day}`;
    }

    function normalizeNumber(value) {
      return String(value || "").trim().replace(/^第/, "").replace(/题$/, "");
    }

    function createId() {
      return `q-${Date.now()}-${Math.random().toString(16).slice(2)}`;
    }

    function escapeHtml(value) {
      return String(value)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    function showNotice(element, message, isError) {
      element.textContent = message;
      element.className = isError ? "notice error" : "notice";
      setTimeout(() => {
        if (element.textContent === message) element.textContent = "";
      }, 3600);
    }

    renderAll();
  </script>
</body>
